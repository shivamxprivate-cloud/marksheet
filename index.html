<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuMatch & Rename Automator - Bulk Image Matching, OCR & Excel Renamer</title>
    <meta name="description" content="Free client-side bulk document image matcher, OCR extractor, collision-safe smart renamer, and Excel verification suite for up to 500 documents." />
    <meta property="og:title" content="DocuMatch & Rename Automator - Bulk Image Matching, OCR & Excel Renamer" />
    <meta property="og:description" content="Free client-side bulk document image matcher, OCR extractor, collision-safe smart renamer, and Excel verification suite for up to 500 documents." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Prevent unhandled errors from browser extensions (e.g. ad blockers / request interceptors)
      window.addEventListener(
        'error',
        function (event) {
          if (
            (event.filename && event.filename.includes('chrome-extension://')) ||
            (event.message &&
              (event.message.includes('Cannot set property fetch') ||
                event.message.includes('fetch of #<Window>')))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        },
        true
      );

      // Ensure window.fetch has both getter and setter so third-party extensions can safely wrap it
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          const originalFetch = window.fetch.bind(window);
          let currentFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e1) {
            try {
              window.fetch = originalFetch;
            } catch (e2) {}
          }
        }
      } catch (err) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
